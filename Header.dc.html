<script type="text/x-dc" data-dc-script>

  state = { scrolled: false, openIndex: null, mobileOpen: false, mobileOpenIndex: null, isMobile: false };

  componentDidMount() {
    this._onScroll = () => this.setState({ scrolled: window.scrollY > 260 });
    window.addEventListener('scroll', this._onScroll, { passive: true });
    this._onResize = () => this.setState({ isMobile: window.innerWidth < 1180 });
    this._onResize();
    window.addEventListener('resize', this._onResize);
  }

  componentWillUnmount() {
    window.removeEventListener('scroll', this._onScroll);
    window.removeEventListener('resize', this._onResize);
  }

  openMenu(i) { this.setState({ openIndex: i }); }
  closeMenu() { this.setState({ openIndex: null }); }
  toggleMobile() { this.setState(s => ({ mobileOpen: !s.mobileOpen })); }
  toggleMobileItem(i) { this.setState(s => ({ mobileOpenIndex: s.mobileOpenIndex === i ? null : i })); }

  renderVals() {
    const raw = this.getMenuData();
    const menu = raw.map((item, i) => ({
      ...item,

      hasChildren: !!item.children,
      isOpen: this.state.openIndex === i,
      mobileOpen: this.state.mobileOpenIndex === i,
      mobileToggleLabel: this.state.mobileOpenIndex === i ? '\u2212' : '+',

      toggleThis: () => this.toggleMobileItem(i),
      children: (item.children || []).map(c => ({ ...c, hasChildren: !!c.children })),

      menu,
      mobileOpen: this.state.mobileOpen,
      isMobile: this.state.isMobile,
      isDesktop: !this.state.isMobile,
